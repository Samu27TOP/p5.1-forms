<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Store - Pet Profiles</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>Pet Store: Pet Profile Management</h1>
  </header>

  <main>
    <section class="card">

      <h2 id="form-title">Add Pet</h2>

      <form id="pet-form" novalidate>

        <div class="field">
          <label for="name">Pet Name</label>
          <input type="text" id="name" placeholder="Rex">
          <small class="error" id="name-error"></small>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="Friendly and playful">
        </div>

        <div class="field">
          <label for="image">Image URL</label>
          <input type="text" id="image" placeholder="https://example.com/pet.jpg">
          <small class="error" id="image-error"></small>
        </div>

        <div class="field">
          <label for="birthdate">Birthdate</label>
          <input type="date" id="birthdate">
          <small class="error" id="birthdate-error"></small>
        </div>

        <div class="field">
          <label for="price">Price</label>
          <input type="number" id="price" step="0.01" placeholder="150.00">
          <small class="error" id="price-error"></small>
        </div>

        <div class="field">
          <label for="code">Pet Code</label>
          <input type="text" id="code" placeholder="CAT123" maxlength="6">
          <small class="error" id="code-error"></small>
        </div>

        <div class="field checkbox">
          <input type="checkbox" id="sold">
          <label for="sold">Sold</label>
        </div>

        <div class="actions">
          <button type="submit" id="submit-btn">Add Pet</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
        </div>

      </form>

    </section>

    <section>

      <h2>Pet List</h2>
      <p id="empty-msg">No pets yet.</p>
      <div id="pet-list" class="pet-list"></div>

    </section>
  </main>

  <script src="script.js"></script>

</body>
</html>
